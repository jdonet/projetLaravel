name: Mon premier pipeline

on:
  push:

jobs:
  bonjour:
    runs-on: ubuntu-latest
    steps:
      - name: Dire bonjour
        run: echo "Je suis le job bonjour"

  aurevoir:
    runs-on: ubuntu-latest
    needs: bonjour        # attend que bonjour soit terminé
    steps:
      - name: Dire au revoir
        run: echo "Je suis le job aurevoir, bonjour est terminé"
